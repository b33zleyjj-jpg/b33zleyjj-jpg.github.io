<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J J Beezley</title>
<meta name="description" content="Games by J J Beezley.">
<style>
  :root { --ink: #2B2620; --soft: #6E655B; --paper: #F7F2E9; --card: #FFFCF6; --line: #E6DCCB; --link: #8A4B1F; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #EFE8DC; --soft: #B9B2A6; --paper: #1A1714; --card: #221E1A; --line: #3A332C; --link: #E8B48A; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 2rem; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 1.15rem; margin: 36px 0 8px; }
  h3 { font-size: 1rem; margin: 20px 0 6px; }
  p, li { color: var(--ink); }
  .meta { color: var(--soft); margin: 0 0 28px; }
  .summary { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; }
  .summary ul { margin: 8px 0 0; padding-left: 20px; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 0.95rem; }
  th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; }
  a { color: var(--link); }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<main>
  <h1>J J Beezley</h1>
  <p class="meta">Small games for iPhone and iPad</p>
  <h2>tiltd</h2>
  <p>A one-thumb balancing puzzle. <a href="tiltd/">Support</a> · <a href="tiltd/privacy">Privacy policy</a></p>
  <h2>Contact</h2>
  <p><a href="mailto:b33zley.jj@gmail.com">b33zley.jj@gmail.com</a></p>
</main>
</body>
</html>
